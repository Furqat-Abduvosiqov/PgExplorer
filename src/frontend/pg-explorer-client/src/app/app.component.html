<div class="app-layout">
  <header class="app-header">
    <div class="header-content">
      <div class="logo-section">
        <h1 (click)="navigate('/')" class="app-title">{{ title }}</h1>
        <div *ngIf="selectedConnection" class="connection-info">
          <span class="connection-label">Connected to:</span>
          <span class="connection-name">{{ selectedConnection?.name }}</span>
        </div>
      </div>

      <nav class="main-nav">
        <button
          (click)="navigate('/connections')"
          [class.active]="isRouteActive('/connections')"
          class="nav-btn">
          🔌 Connections
        </button>

        <button
          (click)="navigate('/databases')"
          [class.active]="isRouteActive('/databases')"
          [disabled]="!selectedConnection"
          class="nav-btn">
          🗃️ Databases
        </button>

        <button
          (click)="navigate('/query-editor')"
          [class.active]="isRouteActive('/query-editor')"
          [disabled]="!selectedConnection"
          class="nav-btn">
          📝 Query Editor
        </button>

        <button
          (click)="navigate('/queries')"
          [class.active]="isRouteActive('/queries')"
          [disabled]="!selectedConnection"
          class="nav-btn">
          📜 Query History
        </button>

        <button
          (click)="navigate('/tables')"
          [class.active]="isRouteActive('/tables')"
          [disabled]="!selectedConnection"
          class="nav-btn">
          📊 Tables
        </button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
